version: "3.9"
services:
  imlca:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: imlca:noetic
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      # Prefer software Mesa in container
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      GALLIUM_DRIVER: llvmpipe
      ROS_MASTER_URI: http://localhost:11311
      ROS_HOSTNAME: imlca
      LAUNCH_FILE: ${LAUNCH_FILE:-manual_controller_headless.launch}
      HEADLESS: ${HEADLESS:-1}
    volumes:
      - ..:/workspace:rw
    stdin_open: true
    tty: true
