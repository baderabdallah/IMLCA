version: "3.9"
services:
  imlca:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: imlca:noetic
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=imlca
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - LAUNCH_FILE=${LAUNCH_FILE:-manual_controller_headless.launch}
      - HEADLESS=${HEADLESS:-1}
    volumes:
      - ..:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
  # On macOS, host network is not supported; run all nodes in one container.
  # If you need to expose ROS master, uncomment the next lines, but note ROS 1 uses dynamic ports.
  # ports:
  #   - "11311:11311"
    stdin_open: true
    tty: true
